# Serves the built SPA and proxies API calls to the backend container.
# Legacy validator API paths (/policies, /claims, /rules, /documents) are also client
# routes, so browser page loads (Accept: text/html) get index.html and API calls are proxied.
map $http_accept $is_html {
    default 0;
    "~text/html" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }
    location = /health { proxy_pass http://backend:5001; }

    location ~ ^/(policies|claims|rules|documents)(/|$) {
        if ($is_html) { rewrite ^ /index.html last; }
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
    }

    location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }
}
