# ClearClaim local stack: PostgreSQL + FastAPI backend + nginx-served frontend.
#   copy .env.example .env      (edit POSTGRES_PASSWORD at least)
#   docker compose up --build
#   open http://localhost:8080
#   docker compose down          (add -v to also delete the database volume)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clearclaim}
      POSTGRES_USER: ${POSTGRES_USER:-clearclaim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clearclaim} -d ${POSTGRES_DB:-clearclaim}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-clearclaim}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clearclaim}
      APP_ENV: ${APP_ENV:-docker}
      DATA_MODE: ${DATA_MODE:-demo}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      CLEARCLAIM_WRITE_TOKEN: ${CLEARCLAIM_WRITE_TOKEN:-}
      ALLOW_EXPERIMENTS: ${ALLOW_EXPERIMENTS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
